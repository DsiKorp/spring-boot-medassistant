services:
  postgress:
    image: postgres:17.1-alpine
    container_name: medassistant-db-container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - medassistant-data:/var/lib/postgresql/data
volumes:
  medassistant-data: